<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="dgt"><style>
text{font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#17202A}
.t{font-size:13px;font-weight:600}
.s{font-size:11px;fill:#566370}
.m{font-family:"IBM Plex Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:10.5px;fill:#566370}
.zl{font-family:"IBM Plex Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:11px;letter-spacing:.06em;fill:#566370}
.lbl{font-size:10.5px;fill:#566370}
.box{fill:#FFFFFF;stroke:#C5CED7;stroke-width:1.2}
.cl{fill:#DCEEF4;stroke:#0F6886;stroke-width:1.5}
.dt{fill:#F5EAD9;stroke:#8F5410;stroke-width:1.5}
.ll{fill:#E8E5F7;stroke:#5444AE;stroke-width:1.5}
.chip{fill:#FFFFFF;stroke:#5444AE;stroke-width:1.2}
.step{fill:#FFFFFF;stroke:#C5CED7;stroke-width:1}
.row{fill:#FFFFFF;stroke:#0F6886;stroke-width:.8;stroke-opacity:.5}
.ar{fill:none;stroke:#566370;stroke-width:1.4}
.ar.dash{stroke-dasharray:4 3}
.ah{fill:#566370}
.num{fill:#17202A}
.numt{fill:#FFFFFF;font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:10.5px;font-weight:500}
.lg{font-size:11px;fill:#566370}
</style><rect width="1240" height="820" fill="#FFFFFF"/>
      <title id="dgt">Architecture of New Item Evaluation on Cloudera AI</title>
      <defs>
        <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
      </defs>

      <!-- Browser -->
      <rect class="box" x="20" y="60" width="200" height="190" rx="6"/>
      <text class="t" x="34" y="86">Browser UI</text>
      <text class="s" x="34" y="106">React 19, Vite, Tailwind</text>
      <text class="s" x="34" y="130">Submit image and product data</text>
      <text class="s" x="34" y="148">Watch the steps stream in</text>
      <text class="s" x="34" y="166">Read the verdict and analysis</text>
      <text class="s" x="34" y="184">Ask follow-up questions</text>
      <text class="s" x="34" y="202">Batch runs, history, replay</text>
      <text class="m" x="34" y="232">frontend/dist</text>

      <!-- Workbench zone -->
      <rect class="cl" x="250" y="20" width="640" height="775" rx="8" style="fill-opacity:.35"/>
      <text class="zl" x="266" y="42">CLOUDERA AI WORKBENCH · PROJECT</text>

      <!-- Application pod -->
      <rect class="box" x="270" y="56" width="600" height="500" rx="6"/>
      <text class="zl" x="286" y="78">APPLICATION POD · deploy/app.py · 4 CPU, 16 GB</text>

      <rect class="box" x="290" y="92" width="560" height="62" rx="5"/>
      <text class="t" x="304" y="116">FastAPI on Uvicorn</text>
      <text class="s" x="304" y="136">REST /api/*, WebSockets /ws/*, built UI. Bound to 127.0.0.1:$CDSW_APP_PORT</text>

      <!-- Row A -->
      <rect class="box" x="290" y="178" width="170" height="112" rx="5"/>
      <text class="t" x="302" y="200">CLIP ViT-B/32</text>
      <text class="s" x="302" y="220">open_clip, open weights</text>
      <text class="s" x="302" y="238">Image + text vectors</text>
      <text class="s" x="302" y="256">averaged, 512 dims</text>
      <text class="m" x="302" y="278">embedding_client.py</text>

      <rect class="box" x="485" y="178" width="170" height="112" rx="5"/>
      <text class="t" x="497" y="200">OpenSearch 2.11</text>
      <text class="s" x="497" y="220">Embedded in the pod</text>
      <text class="s" x="497" y="238">k-NN HNSW, cosine</text>
      <text class="s" x="497" y="256">Index loaded at start</text>
      <text class="m" x="497" y="278">product-catalog</text>

      <rect class="dt" x="680" y="178" width="170" height="112" rx="5"/>
      <text class="t" x="692" y="200">Data collector</text>
      <text class="s" x="692" y="220">Top 20 look-alikes</text>
      <text class="s" x="692" y="238">Category and overlap</text>
      <text class="s" x="692" y="256">Sales, vendor merge</text>
      <text class="m" x="692" y="278">data_collector.py</text>

      <path class="ar" d="M460,234 H481" marker-end="url(#a)"/>
      <path class="ar" d="M655,234 H676" marker-end="url(#a)"/>

      <!-- bus from collector to verdict and crew -->
      <path class="ar" d="M765,290 V300 H375 V306" marker-end="url(#a)"/>
      <path class="ar" d="M765,300 V306" marker-end="url(#a)"/>

      <!-- Row B -->
      <rect class="dt" x="290" y="310" width="170" height="120" rx="5"/>
      <text class="t" x="302" y="332">Verdict matrix</text>
      <text class="s" x="302" y="352">Overlap x category fill</text>
      <text class="s" x="302" y="370">AUTHORIZE / MODIFY /</text>
      <text class="s" x="302" y="388">DECLINE + confidence</text>
      <text class="m" x="302" y="418">compute_verdict()</text>

      <path class="ar" d="M460,370 H476" marker-end="url(#a)"/>

      <rect class="ll" x="480" y="310" width="370" height="120" rx="5"/>
      <text class="t" x="494" y="332">CrewAI crew, sequential</text>
      <text class="m" x="700" y="332">backend/crew</text>
      <rect class="chip" x="494" y="346" width="106" height="66" rx="4"/>
      <text class="t" x="503" y="368" style="font-size:11.5px">1 Risk and</text>
      <text class="t" x="503" y="384" style="font-size:11.5px">market analyst</text>
      <text class="s" x="503" y="402" style="font-size:10px">cannibalization</text>
      <rect class="chip" x="616" y="346" width="106" height="66" rx="4"/>
      <text class="t" x="625" y="368" style="font-size:11.5px">2 Financial</text>
      <text class="t" x="625" y="384" style="font-size:11.5px">modeler</text>
      <text class="s" x="625" y="402" style="font-size:10px">Year 1 scenarios</text>
      <rect class="chip" x="738" y="346" width="98" height="66" rx="4"/>
      <text class="t" x="746" y="368" style="font-size:11.5px">3 Recommen-</text>
      <text class="t" x="746" y="384" style="font-size:11.5px">dation writer</text>
      <text class="s" x="746" y="402" style="font-size:10px">explains verdict</text>
      <path class="ar" d="M600,379 H612" marker-end="url(#a)"/>
      <path class="ar" d="M722,379 H734" marker-end="url(#a)"/>

      <path class="ar" d="M665,430 V446" marker-end="url(#a)"/>

      <!-- Row C -->
      <rect class="dt" x="290" y="450" width="560" height="90" rx="5"/>
      <text class="t" x="304" y="474">Output validators</text>
      <text class="s" x="304" y="494">Normalize competitor references to real SKUs. Keep only replacement candidates that</text>
      <text class="s" x="304" y="510">are declining, clearance, seasonal or bottom shelf (max 3). Recompute best and worst case.</text>
      <text class="m" x="304" y="530">pipeline/orchestrator.py</text>

      <!-- Project storage -->
      <rect class="box" x="270" y="572" width="600" height="96" rx="6"/>
      <text class="t" x="286" y="596">Project storage</text>
      <text class="m" x="286" y="618">data/catalog_products.json   data/images/catalog/   data/catalog_embeddings.jsonl</text>
      <text class="m" x="286" y="636">~/.local (Python, Node, CLIP weights)   .secrets/jwt.json   logs/</text>
      <text class="s" x="286" y="656">Same runtime image for sessions, jobs and the app, so ~/.local installs stay valid.</text>

      <!-- AMP setup -->
      <rect class="box" x="270" y="684" width="600" height="96" rx="6"/>
      <text class="t" x="286" y="706">AMP setup, run once from .project-metadata.yaml</text>
      <g>
        <rect class="step" x="286" y="718" width="76" height="46" rx="4"/><text class="s" x="293" y="737">Check</text><text class="s" x="293" y="753">config</text>
        <rect class="step" x="368" y="718" width="76" height="46" rx="4"/><text class="s" x="375" y="737">Install</text><text class="s" x="375" y="753">deps</text>
        <rect class="step" x="450" y="718" width="76" height="46" rx="4"/><text class="s" x="457" y="737">Job: fetch</text><text class="s" x="457" y="753">295 images</text>
        <rect class="step" x="532" y="718" width="76" height="46" rx="4"/><text class="s" x="539" y="737">Job: CLIP</text><text class="s" x="539" y="753">embeddings</text>
        <rect class="step" x="614" y="718" width="76" height="46" rx="4"/><text class="s" x="621" y="737">Job: create</text><text class="s" x="621" y="753">5 tables</text>
        <rect class="step" x="696" y="718" width="76" height="46" rx="4"/><text class="s" x="703" y="737">Save</text><text class="s" x="703" y="753">token</text>
        <rect class="step" x="778" y="718" width="76" height="46" rx="4"/><text class="s" x="785" y="737">Start</text><text class="s" x="785" y="753">app</text>
      </g>

      <!-- Data Warehouse -->
      <rect class="cl" x="920" y="60" width="300" height="290" rx="8"/>
      <text class="zl" x="936" y="82">CLOUDERA DATA WAREHOUSE</text>
      <text class="t" x="936" y="106">Impala Virtual Warehouse</text>
      <text class="s" x="936" y="126">HTTPS 443, path cliservice, LDAP</text>
      <text class="s" x="936" y="143">with the user's workload password</text>
      <text class="m" x="936" y="168">new_item_eval (Iceberg)</text>
      <rect class="row" x="936" y="178" width="268" height="26" rx="3"/><text class="m" x="946" y="195">products</text>
      <rect class="row" x="936" y="208" width="268" height="26" rx="3"/><text class="m" x="946" y="225">sales_performance</text>
      <rect class="row" x="936" y="238" width="268" height="26" rx="3"/><text class="m" x="946" y="255">category_benchmarks</text>
      <rect class="row" x="936" y="268" width="268" height="26" rx="3"/><text class="m" x="946" y="285">vendor_scorecard</text>
      <rect class="row" x="936" y="298" width="268" height="26" rx="3"/><text class="m" x="946" y="315">evaluation_history</text>

      <!-- AI Inference -->
      <rect class="cl" x="920" y="380" width="300" height="200" rx="8"/>
      <text class="zl" x="936" y="402">CLOUDERA AI INFERENCE</text>
      <text class="t" x="936" y="426">OpenAI-compatible chat endpoint</text>
      <text class="m" x="936" y="448">meta/llama-3.1-8b-instruct (NIM)</text>
      <text class="m" x="936" y="466">Qwen/Qwen2.5-7B-Instruct (vLLM)</text>
      <text class="s" x="936" y="492">Serves all three agents and the</text>
      <text class="s" x="936" y="509">streamed follow-up answers.</text>
      <text class="s" x="936" y="533">Auth: workload JWT, resolved from</text>
      <text class="s" x="936" y="550">CDP_TOKEN, /tmp/jwt, get_jwt(),</text>
      <text class="s" x="936" y="567">or .secrets/jwt.json</text>

      <!-- Open Food Facts -->
      <rect class="box" x="920" y="660" width="300" height="80" rx="6" style="stroke-dasharray:4 3"/>
      <text class="t" x="936" y="684">images.openfoodfacts.org</text>
      <text class="s" x="936" y="704">Catalog product images, downloaded</text>
      <text class="s" x="936" y="721">once by the setup job</text>

      <!-- Connections -->
      <path class="ar" d="M220,123 H286" marker-end="url(#a)" marker-start="url(#a)"/>
      <text class="lbl" x="228" y="114">HTTPS</text>
      <text class="lbl" x="228" y="140">WebSocket</text>

      <path class="ar" d="M850,234 H916" marker-end="url(#a)" marker-start="url(#a)"/>
      <text class="lbl" x="858" y="226">SQL</text>

      <path class="ar" d="M850,370 H895 V470 H916" marker-end="url(#a)"/>
      <text class="lbl" x="858" y="362">chat</text>

      <path class="ar dash" d="M920,700 H900 V741 H858" marker-end="url(#a)"/>

      <!-- Step numbers on the request path -->
      <g>
        <circle class="num" cx="253" cy="123" r="9"/><text class="numt" x="253" y="127" text-anchor="middle">1</text>
        <circle class="num" cx="375" cy="178" r="9"/><text class="numt" x="375" y="182" text-anchor="middle">2</text>
        <circle class="num" cx="570" cy="178" r="9"/><text class="numt" x="570" y="182" text-anchor="middle">3</text>
        <circle class="num" cx="883" cy="234" r="9"/><text class="numt" x="883" y="238" text-anchor="middle">4</text>
        <circle class="num" cx="290" cy="370" r="9"/><text class="numt" x="290" y="374" text-anchor="middle">5</text>
        <circle class="num" cx="895" cy="420" r="9"/><text class="numt" x="895" y="424" text-anchor="middle">6</text>
        <circle class="num" cx="290" cy="495" r="9"/><text class="numt" x="290" y="499" text-anchor="middle">7</text>
      </g>
    <g transform="translate(20,290)">
<rect class="cl" x="0" y="0" width="11" height="11" rx="2"/><text class="lg" x="18" y="10">Cloudera service</text>
<rect class="dt" x="0" y="20" width="11" height="11" rx="2"/><text class="lg" x="18" y="30">Deterministic code</text>
<rect class="ll" x="0" y="40" width="11" height="11" rx="2"/><text class="lg" x="18" y="50">LLM agents</text>
<rect class="box" x="0" y="60" width="11" height="11" rx="2"/><text class="lg" x="18" y="70">Open source in the project</text>
</g></svg>